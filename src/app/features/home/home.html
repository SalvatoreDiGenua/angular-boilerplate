<main id="main-content" class="min-h-dvh bg-slate-50 px-6 py-16 text-slate-900 dark:bg-slate-950 dark:text-slate-50">
  <section class="mx-auto flex max-w-4xl flex-col gap-8" aria-labelledby="page-title">
    <div>
      <p class="mb-3 text-sm font-semibold uppercase tracking-wider text-sky-700 dark:text-sky-300">
        Angular 22 boilerplate
      </p>
      <h1 id="page-title" class="text-4xl font-bold tracking-tight sm:text-5xl">
        {{ 'home.title' | transloco }}
      </h1>
      <p class="mt-4 max-w-2xl text-lg text-slate-600 dark:text-slate-300">
        {{ 'home.description' | transloco }}
      </p>
    </div>

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-label="Core features">
      @for (feature of ['SSR', 'i18n', 'Tailwind CSS', 'Vitest', 'Signals', 'HTTP interceptors']; track feature) {
        <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <h2 class="font-semibold">{{ feature }}</h2>
        </article>
      }
    </div>

    <div class="flex flex-wrap gap-3">
      <button
        type="button"
        class="min-h-11 rounded-lg bg-slate-900 px-5 py-2.5 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 dark:bg-white dark:text-slate-900"
        (click)="language.toggle()"
        [attr.aria-label]="'home.changeLanguage' | transloco"
      >
        {{ language.language() }}
      </button>
      <a
        routerLink="/"
        class="inline-flex min-h-11 items-center rounded-lg border border-slate-300 px-5 py-2.5 font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 dark:border-slate-700"
      >
        {{ 'home.homeLink' | transloco }}
      </a>
    </div>
  </section>
</main>
